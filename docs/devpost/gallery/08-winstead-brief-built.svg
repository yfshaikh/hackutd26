<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="a-2b2348" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2b2348"/></marker><marker id="a-9b6bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#9b6bff"/></marker><marker id="a-4fe3a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#4fe3a8"/></marker><marker id="a-ff5c7c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ff5c7c"/></marker><marker id="a-ffc857" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ffc857"/></marker><marker id="a-8fa8ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8fa8ff"/></marker><marker id="a-8a84a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8a84a8"/></marker><marker id="a-f08bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#f08bff"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#7828ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7828ff" stop-opacity="0"/></radialGradient></defs><rect width="1500" height="1000" fill="#07060d"/><rect width="1500" height="1000" fill="url(#glow)"/><text x="60" y="82" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f4f2ff" text-anchor="start" font-style="italic" letter-spacing="1.5">WINSTEAD BRIEF, BUILT</text><text x="60" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a69fc4" text-anchor="start">Each required component of the cyber incident response dashboard, and how the command center delivers it.</text><text x="1440" y="970" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#5c5680" text-anchor="end" letter-spacing="2">HACKUTD 2026 · ZERO DAY COMMAND CENTER</text><rect x="60" y="170" width="400" height="104" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="260.0" y="230.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="middle">01 Secure &amp; isolated</text><path d="M460 222 L496 222" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="500" y="170" width="940" height="104" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="970" y="214" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#f4f2ff" text-anchor="middle">runs off the attacked cluster · own login, HttpOnly session</text><text x="970" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a69fc4" text-anchor="middle">an attacker who owns the cluster can&#x27;t erase the record or approve</text><rect x="60" y="294" width="400" height="104" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="260.0" y="354.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="middle">02 Access control</text><path d="M460 346 L496 346" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="500" y="294" width="940" height="104" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="970" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#f4f2ff" text-anchor="middle">admins add people and set roles: admin · approver ·</text><text x="970" y="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a69fc4" text-anchor="middle">responder · operator · viewer, enforced on the server</text><rect x="60" y="418" width="400" height="104" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="260.0" y="478.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="middle">03 Incident documentation</text><path d="M460 470 L496 470" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="500" y="418" width="940" height="104" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="970" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#f4f2ff" text-anchor="middle">NIST SP 800-61 record filled live by agents + team · PDF export</text><text x="970" y="494" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a69fc4" text-anchor="middle">breach-notification countdowns: 72-hour clock on exfiltration</text><rect x="60" y="542" width="400" height="104" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="260.0" y="602.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="middle">04 Scope definitions</text><path d="M460 594 L496 594" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="500" y="542" width="940" height="104" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="970" y="586" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#f4f2ff" text-anchor="middle">clean · investigating · exfiltrated · encrypted/locked · contained</text><text x="970" y="618" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a69fc4" text-anchor="middle">with evidence, e.g. “302 MB left to the attacker&#x27;s server”</text><rect x="60" y="666" width="400" height="104" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="260.0" y="726.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="middle">05 Real-time comms</text><path d="M460 718 L496 718" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="500" y="666" width="940" height="104" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="970" y="710" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#f4f2ff" text-anchor="middle">out-of-band war room chat · plain-English Briefing for partners</text><text x="970" y="742" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a69fc4" text-anchor="middle">Cartesia phones the on-call engineer when a decision waits</text><rect x="60" y="805" width="440" height="130" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="280.0" y="852.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Security</text><text x="280.0" y="884.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">assume the attacker owns</text><text x="280.0" y="910.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">everything inside</text><rect x="530" y="805" width="440" height="130" rx="14" fill="#8fa8ff" fill-opacity="0.10" stroke="#8fa8ff" stroke-width="2"/><text x="750.0" y="852.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Ease of use</text><text x="750.0" y="884.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">one band: what to do now</text><text x="750.0" y="910.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">one-click Approve / Deny</text><rect x="1000" y="805" width="440" height="130" rx="14" fill="#f08bff" fill-opacity="0.10" stroke="#f08bff" stroke-width="2"/><text x="1220.0" y="852.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Creativity</text><text x="1220.0" y="884.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">judges attack it live;</text><text x="1220.0" y="910.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">AI fills in the record</text></svg>