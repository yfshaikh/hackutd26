r, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a69fc4" text-anchor="start">Rules raise the alarm; three Nemotron agents investigate and contain; the cluster is re-checked.</text><text x="1440" y="970" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#5c5680" text-anchor="end" letter-spacing="2">HACKUTD 2026 · ZERO DAY COMMAND CENTER</text><rect x="60" y="200" width="240" height="260" rx="14" fill="#8a84a8" fill-opacity="0.10" stroke="#8a84a8" stroke-width="2"/><text x="180.0" y="273.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Detector</text><text x="180.0" y="305.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">plain code, every 4 s</text><text x="180.0" y="331.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">unknown pod</text><text x="180.0" y="357.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">weights mount</text><text x="180.0" y="383.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">rogue CronJob</text><text x="180.0" y="409.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">GPU spike</text><rect x="340" y="200" width="240" height="260" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="460.0" y="273.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Triage</text><text x="460.0" y="305.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Nemotron 3 Nano</text><text x="460.0" y="331.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">severity, phase,</text><text x="460.0" y="357.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">category</text><text x="460.0" y="383.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">look-only</text><text x="460.0" y="409.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">6 rounds</text><rect x="620" y="200" width="240" height="260" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="740.0" y="273.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Investigator</text><text x="740.0" y="305.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Nemotron 3 Nano</text><text x="740.0" y="331.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">hypotheses + evidence</text><text x="740.0" y="357.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">CVE via NVD</text><text x="740.0" y="383.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">mining $ via CoinGecko</text><text x="740.0" y="409.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">8 rounds</text><rect x="900" y="200" width="240" height="260" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="1020.0" y="273.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Advisor</text><text x="1020.0" y="305.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Nemotron 3 Ultra</text><text x="1020.0" y="331.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">ranked containment</text><text x="1020.0" y="357.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">can consult</text><text x="1020.0" y="383.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">the Investigator</text><text x="1020.0" y="409.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">8 rounds</text><rect x="1180" y="200" width="240" height="260" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="1300.0" y="273.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Verify</text><text x="1300.0" y="305.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">re-run detection</text><text x="1300.0" y="331.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">anything respawned?</text><text x="1300.0" y="357.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">send Advisor back</text><text x="1300.0" y="383.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">max 2 passes</text><text x="1300.0" y="409.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle"></text><path d="M300 330 L336 330" fill="none" stroke="#9b6bff" stroke-width="2.5" marker-end="url(#a-9b6bff)"/><rect x="285.6" y="284" width="68.80000000000001" height="27.2" rx="13.6" fill="#07060d" stroke="#9b6bff" stroke-width="1.5"/><text x="320.0" y="304.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#9b6bff" text-anchor="middle">alert</text><path d="M580 330 L616 330" fill="none" stroke="#9b6bff" stroke-width="2.5" marker-end="url(#a-9b6bff)"/><rect x="556.64" y="284" width="86.72" height="27.2" rx="13.6" fill="#07060d" stroke="#9b6bff" stroke-width="1.5"/><text x="600.0" y="304.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#9b6bff" text-anchor="middle">handoff</text><path d="M860 330 L896 330" fill="none" stroke="#9b6bff" stroke-width="2.5" marker-end="url(#a-9b6bff)"/><rect x="836.64" y="284" width="86.72" height="27.2" rx="13.6" fill="#07060d" stroke="#9b6bff" stroke-width="1.5"/><text x="880.0" y="304.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#9b6bff" text-anchor="middle">handoff</text><path d="M1140 330 L1176 330" fill="none" stroke="#9b6bff" stroke-width="2.5" marker-end="url(#a-9b6bff)"/><rect x="1125.6" y="284" width="68.80000000000001" height="27.2" rx="13.6" fill="#07060d" stroke="#9b6bff" stroke-width="1.5"/><text x="1160.0" y="304.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#9b6bff" text-anchor="middle">check</text><path d="M1300 460 L1300 520 L1020 520 L1020 464" fill="none" stroke="#4fe3a8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a-4fe3a8)"/><rect x="1036.0" y="506" width="248.00000000000003" height="27.2" rx="13.6" fill="#07060d" stroke="#4fe3a8" stroke-width="1.5"/><text x="1160" y="526.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4fe3a8" text-anchor="middle">still rogue → re-converge</text><rect x="60" y="590" width="1380" height="330" rx="22" fill="#110d1f" fill-opacity="0.6" stroke="#9b6bff" stroke-width="2" stroke-dasharray="10 8"/><text x="84" y="628" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#9b6bff" text-anchor="start" letter-spacing="1.5">HOW EVERY AGENT WORKS</text><rect x="90" y="650" width="310" height="240" rx="14" fill="#8fa8ff" fill-opacity="0.10" stroke="#8fa8ff" stroke-width="2"/><text x="245.0" y="726.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Rounds</text><text x="245.0" y="758.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">model asks for tools</text><text x="245.0" y="784.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">backend runs them, feeds back</text><text x="245.0" y="810.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">last round: tools withheld,</text><text x="245.0" y="836.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">must answer</text><rect x="425" y="650" width="310" height="240" rx="14" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-width="2"/><text x="580.0" y="726.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Handoffs</text><text x="580.0" y="758.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">each agent&#x27;s summary</text><text x="580.0" y="784.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">is pasted into the next</text><text x="580.0" y="810.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">agent&#x27;s instructions</text><text x="580.0" y="836.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">(visible as traces)</text><rect x="760" y="650" width="310" height="240" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="915.0" y="726.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Scoped tools</text><text x="915.0" y="758.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">per-agent allowlists:</text><text x="915.0" y="784.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Triage + Investigator only look</text><text x="915.0" y="810.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Advisor alone can act</text><text x="915.0" y="836.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">temperature 0</text><rect x="1095" y="650" width="310" height="240" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="1250.0" y="726.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Outputs</text><text x="1250.0" y="758.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">live timeline + traces</text><text x="1250.0" y="784.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">scope board</text><text x="1250.0" y="810.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">NIST SP 800-61 record</text><text x="1250.0" y="836.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">approval cards</text></svg>