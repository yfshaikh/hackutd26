<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="a-2b2348" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2b2348"/></marker><marker id="a-9b6bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#9b6bff"/></marker><marker id="a-4fe3a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#4fe3a8"/></marker><marker id="a-ff5c7c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ff5c7c"/></marker><marker id="a-ffc857" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ffc857"/></marker><marker id="a-8fa8ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8fa8ff"/></marker><marker id="a-8a84a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8a84a8"/></marker><marker id="a-f08bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#f08bff"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#7828ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7828ff" stop-opacity="0"/></radialGradient></defs><rect width="1500" height="1000" fill="#07060d"/><rect width="1500" height="1000" fill="url(#glow)"/><text x="60" y="82" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f4f2ff" text-anchor="start" font-style="italic" letter-spacing="1.5">THREE MISTAKES, ONE BREACH</text><text x="60" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a69fc4" text-anchor="start">The demo&#x27;s vulnerabilities are real ones. Any single fix would have stopped the attack.</text><text x="1440" y="970" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#5c5680" text-anchor="end" letter-spacing="2">HACKUTD 2026 · ZERO DAY COMMAND CENTER</text><rect x="60" y="220" width="320" height="260" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="220.0" y="319.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">1. Jupyter, no auth</text><text x="220.0" y="351.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">token=&#x27;&#x27; , password=&#x27;&#x27;</text><text x="220.0" y="377.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">anyone who reaches :8888</text><text x="220.0" y="403.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">runs code in the pod</text><rect x="60" y="530" width="320" height="90" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="220.0" y="582.35" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f2ff" text-anchor="middle">Fix: SSO / JupyterHub</text><path d="M220 480 L220 526" fill="none" stroke="#4fe3a8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a-4fe3a8)"/><rect x="420" y="220" width="320" height="260" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="580.0" y="319.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">2. Token mounted</text><text x="580.0" y="351.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Kubernetes leaves the</text><text x="580.0" y="377.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">pod&#x27;s identity on disk</text><text x="580.0" y="403.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">readable by any code</text><rect x="420" y="530" width="320" height="90" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="580.0" y="582.35" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f2ff" text-anchor="middle">Fix: automount: false</text><path d="M580 480 L580 526" fill="none" stroke="#4fe3a8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a-4fe3a8)"/><rect x="780" y="220" width="320" height="260" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="940.0" y="319.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">3. Role too broad</text><text x="940.0" y="351.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">notebook-dev may create</text><text x="940.0" y="377.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">pods, jobs, cronjobs</text><text x="940.0" y="403.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">in the law firm&#x27;s namespace</text><rect x="780" y="530" width="320" height="90" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="940.0" y="582.35" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f2ff" text-anchor="middle">Fix: least privilege</text><path d="M940 480 L940 526" fill="none" stroke="#4fe3a8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a-4fe3a8)"/><path d="M380 350 L416 350" fill="none" stroke="#ff5c7c" stroke-width="2.5" marker-end="url(#a-ff5c7c)"/><path d="M740 350 L776 350" fill="none" stroke="#ff5c7c" stroke-width="2.5" marker-end="url(#a-ff5c7c)"/><path d="M1100 350 L1136 350" fill="none" stroke="#ff5c7c" stroke-width="2.5" marker-end="url(#a-ff5c7c)"/><rect x="1140" y="220" width="300" height="400" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="1290.0" y="337.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">= namespace takeover</text><text x="1290.0" y="369.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">create any pod:</text><text x="1290.0" y="395.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">• grab a GPU slot</text><text x="1290.0" y="421.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">• mount the weights</text><text x="1290.0" y="447.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">• plant a CronJob</text><text x="1290.0" y="473.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle"></text><text x="1290.0" y="499.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">create pods ≈ own</text><text x="1290.0" y="525.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">the namespace</text><rect x="60" y="680" width="1380" height="240" rx="22" fill="#110d1f" fill-opacity="0.6" stroke="#ffc857" stroke-width="2" stroke-dasharray="10 8"/><text x="84" y="718" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffc857" text-anchor="start" letter-spacing="1.5">ALSO MISSING</text><rect x="100" y="740" width="400" height="150" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="300.0" y="797.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Separate namespace</text><text x="300.0" y="829.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">notebooks can&#x27;t mount</text><text x="300.0" y="855.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">lawfirm&#x27;s volumes</text><rect x="550" y="740" width="400" height="150" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="750.0" y="797.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Admission policy</text><text x="750.0" y="829.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">block foreign volumes,</text><text x="750.0" y="855.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">images, privileged pods</text><rect x="1000" y="740" width="400" height="150" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="1200.0" y="797.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">GPU ResourceQuota</text><text x="1200.0" y="829.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">cap slots per</text><text x="1200.0" y="855.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">namespace</text></svg>