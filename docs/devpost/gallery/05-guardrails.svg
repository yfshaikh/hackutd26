r="middle">risky</text><rect x="620" y="420" width="240" height="120" rx="14" fill="#8a84a8" fill-opacity="0.10" stroke="#8a84a8" stroke-width="2"/><text x="740.0" y="475.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Pending approval</text><text x="740.0" y="507.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">parked, not run</text><path d="M860 480 L896 480" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="900" y="420" width="240" height="120" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="1020.0" y="462.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Cartesia call</text><text x="1020.0" y="494.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">phones the on-call</text><text x="1020.0" y="520.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">engineer</text><path d="M740 540 L740 616" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><rect x="620" y="620" width="240" height="120" rx="14" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-width="2"/><text x="740.0" y="662.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Human approves</text><text x="740.0" y="694.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">console button,</text><text x="740.0" y="720.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">role-checked</text><path d="M860 680 L1300 680 L1300 324" fill="none" stroke="#ffc857" stroke-width="2.5" marker-end="url(#a-ffc857)"/><path d="M1380 320 L1380 816" fill="none" stroke="#8fa8ff" stroke-width="2.5" marker-end="url(#a-8fa8ff)"/><rect x="1180" y="820" width="240" height="110" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="1300.0" y="870.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">k3s API</text><text x="1300.0" y="902.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">RBAC has the last word</text><rect x="60" y="400" width="520" height="530" rx="22" fill="#110d1f" fill-opacity="0.6" stroke="#8fa8ff" stroke-width="2" stroke-dasharray="10 8"/><text x="84" y="438" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#8fa8ff" text-anchor="start" letter-spacing="1.5">TWO SCOPED IDENTITIES</text><rect x="90" y="460" width="460" height="190" rx="14" fill="#8fa8ff" fill-opacity="0.10" stroke="#8fa8ff" stroke-width="2"/><text x="320.0" y="524.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">agent-readonly</text><text x="320.0" y="556.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">get / list / watch everywhere</text><text x="320.0" y="582.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">pods, logs, nodes, jobs, policies</text><text x="320.0" y="608.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">no secrets, no writes</text><rect x="90" y="670" width="460" height="230" rx="14" fill="#8fa8ff" fill-opacity="0.10" stroke="#8fa8ff" stroke-width="2"/><text x="320.0" y="741.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">agent-executor</text><text x="320.0" y="773.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">delete pods · quarantine pods</text><text x="320.0" y="799.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">delete CronJobs · cordon node</text><text x="320.0" y="825.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">delete exactly ONE RoleBinding:</text><text x="320.0" y="851.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">notebook-dev</text><text x="60" y="968" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#a69fc4" text-anchor="start">The admin kubeconfig never leaves the backend; the AI only ever holds these two scoped tokens.</text></svg>