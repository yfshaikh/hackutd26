mily="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a69fc4" text-anchor="start">The AI only asks; the backend decides; a human signs off on anything that touches real work.</text><text x="1440" y="970" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#5c5680" text-anchor="end" letter-spacing="2">HACKUTD 2026 · ZERO DAY COMMAND CENTER</text><rect x="60" y="190" width="240" height="130" rx="14" fill="#ff5c7c" fill-opacity="0.10" stroke="#ff5c7c" stroke-width="2"/><text x="180.0" y="237.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Advisor</text><text x="180.0" y="269.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">Nemotron asks for</text><text x="180.0" y="295.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">a tool call</text><rect x="340" y="190" width="240" height="130" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="460.0" y="237.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">Tool allowlist</text><text x="460.0" y="269.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">only the Advisor</text><text x="460.0" y="295.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#a69fc4" text-anchor="middle">gets write tools</text><rect x="620" y="190" width="240" height="130" rx="14" fill="#4fe3a8" fill-opacity="0.10" stroke="#4fe3a8" stroke-width="2"/><text x="740.0" y="237.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="middle">classify()</